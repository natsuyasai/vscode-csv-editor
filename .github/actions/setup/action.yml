name: Setup Node and install dependencies
description: Setup Node.js with npm cache and install root / webview-ui dependencies with npm ci

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          package-lock.json
          webview-ui/package-lock.json

    - name: Install root dependencies
      shell: bash
      run: npm ci

    - name: Install webview-ui dependencies
      shell: bash
      working-directory: webview-ui
      run: npm ci
