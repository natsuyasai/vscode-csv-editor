name: PR Build, Lint, and Test

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  check:
    name: type check and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Type check root
        run: npm run check-types

      - name: Lint root
        run: npm run lint

      - name: Type check webview-ui
        working-directory: webview-ui
        run: npm run check-types

      - name: Lint webview-ui
        working-directory: webview-ui
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build extension (production)
        run: npm run package

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install playwright
        working-directory: webview-ui
        run: npx playwright install --with-deps chromium

      - name: Run unit tests (webview-ui)
        working-directory: webview-ui
        run: npx vitest --project unit --run

      - name: Run storybook tests (webview-ui)
        working-directory: webview-ui
        run: npx vitest --project storybook --run

      - name: Build webview-ui for extension tests
        run: npm run build:webview

      - name: VSCode extension tests
        run: timeout 400 xvfb-run -a npm test
